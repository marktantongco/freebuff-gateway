# ─────────────────────────────────────────────────────────────
# Freebuff Gateway — Docker Compose
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d                  # Start gateway only
#   docker compose --profile full up -d   # Start with Prometheus + Grafana
#   docker compose logs -f gateway        # Follow logs
#   docker compose exec gateway sh        # Shell into container
# ─────────────────────────────────────────────────────────────

services:
  # ─── Gateway ──────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        COMMIT: "${GIT_COMMIT:-dev}"
        BUILD_TIME: "${BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
    container_name: freebuff-gateway
    ports:
      - "${GATEWAY_PORT:-30080}:30080"
    environment:
      # Core
      - LISTEN_ADDR=:30080
      - DB_PATH=/app/data/freebuff.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Session
      - SESSION_WAIT_ON_FULL=${SESSION_WAIT_ON_FULL:-false}
      - SESSION_CREATE_MAX_PARALLEL_GLOBAL=${SESSION_CREATE_MAX_PARALLEL_GLOBAL:-128}
      - SESSION_CREATE_MAX_PARALLEL_PER_KEY=${SESSION_CREATE_MAX_PARALLEL_PER_KEY:-32}

      # Transport
      - TRANSPORT_REQUEST_REUSE=${TRANSPORT_REQUEST_REUSE:-false}

      # Rate Limiting
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-200}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-400}

      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}

      # Proxy Healthcheck
      - PROXY_HEALTHCHECK_ENABLED=${PROXY_HEALTHCHECK_ENABLED:-true}
      - PROXY_HEALTHCHECK_INTERVAL=${PROXY_HEALTHCHECK_INTERVAL:-1m}

      # Alerting — Webhook
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}

      # Alerting — Slack
      - ALERT_SLACK_URL=${ALERT_SLACK_URL:-}

      # Alerting — Telegram
      - ALERT_TELEGRAM_TOKEN=${ALERT_TELEGRAM_TOKEN:-}
      - ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID:-}

      # Alerting — Discord
      - ALERT_DISCORD_URL=${ALERT_DISCORD_URL:-}

      # Alerting — Email (SMTP)
      - ALERT_EMAIL_SMTP=${ALERT_EMAIL_SMTP:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_CC=${ALERT_EMAIL_CC:-}
      - ALERT_EMAIL_BCC=${ALERT_EMAIL_BCC:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@freebuff-gateway}
      - ALERT_EMAIL_USERNAME=${ALERT_EMAIL_USERNAME:-}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD:-}

      # Alerting — PagerDuty
      - ALERT_PAGERDUTY_KEY=${ALERT_PAGERDUTY_KEY:-}
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:30080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - freebuff-net

  # ─── Prometheus (optional) ───────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: freebuff-prometheus
    profiles: ["full", "monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - freebuff-net
    depends_on:
      gateway:
        condition: service_healthy

  # ─── Grafana (optional) ──────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: freebuff-grafana
    profiles: ["full", "monitoring"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - freebuff-net
    depends_on:
      prometheus:
        condition: service_started

# ─── Networks ────────────────────────────────────────────────
networks:
  freebuff-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  gateway-data:
    driver: local
  gateway-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

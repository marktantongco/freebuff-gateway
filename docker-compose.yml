version: '3.8'

services:
  gateway:
    build: .
    ports:
      - "30080:30080"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_WAIT_ON_FULL=false
      - TRANSPORT_TIMEOUT=60s
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=60
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Prometheus metrics
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   depends_on:
  #     - gateway

volumes:
  gateway-data:

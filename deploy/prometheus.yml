# ─────────────────────────────────────────────────────────────
# Prometheus Configuration for Freebuff Gateway
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "freebuff-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:30080"]
        labels:
          service: "freebuff-gateway"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

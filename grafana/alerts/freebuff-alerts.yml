groups:
  - name: freebuff-gateway
    rules:
      # Gateway down
      - alert: FreebuffGatewayDown
        expr: up{job="freebuff-gateway"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Freebuff Gateway is down"
          description: "The gateway has been unreachable for more than 30 seconds."

      # High error rate
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "The 5xx error rate has exceeded 5% for 2 minutes."

      # Critical error rate
      - alert: CriticalErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical 5xx error rate (>20%)"
          description: "The 5xx error rate has exceeded 20% for 1 minute."

      # High latency p95
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency (>5s)"
          description: "The 95th percentile latency has exceeded 5 seconds."

      # Critical latency p99
      - alert: CriticalLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 10.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical p99 latency (>10s)"
          description: "The 99th percentile latency has exceeded 10 seconds."

      # High memory usage (>500MB)
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="freebuff-gateway"} > 500 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage (>500MB)"
          description: "The gateway is using more than 500MB of RAM."

      # Critical memory (>1GB)
      - alert: CriticalMemoryUsage
        expr: process_resident_memory_bytes{job="freebuff-gateway"} > 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage (>1GB)"
          description: "The gateway is using more than 1GB of RAM."

      # Goroutine leak
      - alert: GoroutineLeak
        expr: go_goroutines{job="freebuff-gateway"} > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine leak detected (>10K goroutines)"
          description: "The number of goroutines exceeds 10,000."

      # File descriptor exhaustion
      - alert: FileDescriptorExhaustion
        expr: process_open_fds{job="freebuff-gateway"} / process_max_fds{job="freebuff-gateway"} > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "File descriptor usage >80%"
          description: "The gateway is using more than 80% of available file descriptors."

      # High GC pressure
      - alert: HighGCPressure
        expr: rate(go_gc_duration_seconds_count{job="freebuff-gateway"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GC pressure (>10 cycles/s)"
          description: "Garbage collection is running more than 10 times per second."

      # Request queue full
      - alert: QueueFull
        expr: freebuff_queue_depth > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Request queue is filling up (>100)"
          description: "The request queue depth exceeds 100."

      # Active sessions too high
      - alert: TooManySessions
        expr: freebuff_active_sessions > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many active sessions (>1000)"
          description: "The number of active sessions exceeds 1,000."

      # 429 rate limit hits
      - alert: HighRateLimitHits
        expr: sum(rate(http_requests_total{status_code="429"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit hits (>1/s)"
          description: "The gateway is returning 429 Too Many Requests at a high rate."

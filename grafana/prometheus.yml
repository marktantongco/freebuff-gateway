global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/freebuff-alerts.yml"

scrape_configs:
  - job_name: "freebuff-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:30080"]
        labels:
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
